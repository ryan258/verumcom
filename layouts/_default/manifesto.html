{{ define "main" }}
<div class="manifesto-break">
  <div class="manifesto-break__container">
    <div class="badge-tag manifesto-break__badge">
      {{ i18n "manifesto_kicker" }}
    </div>

    <h1 class="manifesto-break__lead glitch-text">
      {{ .Title }}
    </h1>

    {{ partial "brand-story.html" . }}

    <div class="manifesto-break__body">
      {{ .Content }}
    </div>

    <div class="manifesto-break__footer">
      <span class="mono-meta manifesto-break__footer-meta">{{ i18n "manifesto_footer" }}</span>
      <a href="{{ relref . "lookbook" }}" class="btn btn--ink">
        <span>{{ i18n "cta_lookbook" }}</span>
        <span class="ui-symbol" aria-hidden="true">→</span>
      </a>
    </div>
  </div>
</div>
{{ end }}
