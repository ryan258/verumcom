{{ define "main" }}
<div class="error-view">

  <h1 class="error-view__title">{{ i18n "error_404_title" }}</h1>
  <p class="error-view__desc">{{ i18n "error_404_desc" }}</p>
  <div>
    <a href="{{ .Site.Home.RelPermalink }}" class="btn btn--primary">
      <span class="ui-symbol" aria-hidden="true">←</span>
      <span>{{ i18n "cta_back_home" }}</span>
    </a>
  </div>
</div>
{{ end }}
